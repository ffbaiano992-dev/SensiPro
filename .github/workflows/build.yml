name: Compilar SensiPro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extrair projeto
        run: |
          unzip -o SensiPro_PlayStore_Projeto.zip -d projeto
          find projeto -maxdepth 3 -type f | head -50

      - name: Configurar AndroidX
        run: |
          mkdir -p projeto/SensiProApp
          touch projeto/SensiProApp/gradle.properties
          echo "android.useAndroidX=true" >> projeto/SensiProApp/gradle.properties
          echo "android.enableJetifier=true" >> projeto/SensiProApp/gradle.properties

      - name: Corrigir Kotlin
        run: |
          cat > projeto/kotlin-fix.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
            }
          }
          EOF

      - name: Compilar AAB
        working-directory: projeto/SensiProApp
        run: gradle -I ../kotlin-fix.gradle bundleRelease

      - name: Salvar AAB
        uses: actions/upload-artifact@v4
        with:
          name: SensiPro-AAB
          path: projeto/SensiProApp/app/build/outputs/bundle/release/*.aab
